# Runs the API (Kidolegends/agendamento-api) and this panel together.
#
#   docker compose up --build
#   open http://localhost:8080   (admin@agendamento.dev / admin123)
#
# By default the API image is built straight from GitHub. If you cloned the API next to
# this repo, build from your local copy instead:
#   API_CONTEXT=../agendamento-api docker compose up --build
services:
  api:
    build:
      context: ${API_CONTEXT:-https://github.com/Kidolegends/agendamento-api.git#main}
    environment:
      NODE_ENV: production
      PORT: 3333
      # In production mode the API requires a random secret with 32+ characters.
      # This default is for local demos only: set your own JWT_SECRET anywhere else.
      JWT_SECRET: ${JWT_SECRET:-demo-only-secret-change-me-0123456789abcdef}
      BUSINESS_UTC_OFFSET: '-03:00'
      # The API sits behind nginx, so trust X-Forwarded-For for rate limiting
      TRUST_PROXY: 'true'
      # Creates the demo users and data on first start (only if the database is empty)
      SEED_DEMO_DATA: 'true'
    volumes:
      - api-data:/data
    ports:
      - '3333:3333' # optional: Swagger UI at http://localhost:3333/docs
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    build: .
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:8080'

volumes:
  api-data:
