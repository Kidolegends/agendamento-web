name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t agendamento-web .

  compose:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Start the API and the panel together
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: The panel is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: Login works through the nginx /api proxy
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@agendamento.dev","password":"admin123"}' | grep -q '"token"'
      - name: Deep links fall back to index.html (SPA routing)
        run: curl -fsS http://localhost:8080/appointments/new | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
