server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin proxy: the API has no CORS config, and this way it is not needed.
  # "/api/appointments" -> "http://api:3333/appointments"
  location /api/ {
    proxy_pass http://api:3333/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build assets can be cached forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single page app: unknown paths fall back to index.html (React Router handles them)
  location / {
    try_files $uri /index.html;
  }
}
